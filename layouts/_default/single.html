{{ define "main" }}
<article class="post-full">
  <header class="post-header">
    <h1>{{ .Title }}</h1>
    {{- if eq .Section "posts" }}
    <div class="post-meta">
      <time datetime="{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}">{{ .Date.Format "2006-01-02" }}</time>
      {{- if .ReadingTime }} · 约 {{ .ReadingTime }} 分钟{{ end }}
      {{- if .Site.Params.busuanzi }} · <span id="busuanzi_container_page_pv" style="display:none">阅读 <span id="busuanzi_value_page_pv"></span> 次</span>{{ end }}
    </div>
    {{- end }}
  </header>
  <div class="post-content">
    {{ .Content }}
  </div>
</article>
{{ end }}
